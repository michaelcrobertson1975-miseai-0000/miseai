<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MiseAI — Application status</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f1e8;color:#292720;font:16px/1.55 Arial,sans-serif}main{max-width:760px;margin:40px auto;padding:24px}a{color:inherit}h1,h2{font-family:Georgia,serif}h1{font-size:34px;line-height:1.2}section{padding:26px;background:#fffdf8;border:1px solid #d7d0c2;border-radius:10px;margin-top:20px}label{display:block;margin-top:17px;font-weight:600}input,select,textarea{display:block;width:100%;margin-top:6px;padding:11px;border:1px solid #aaa;border-radius:4px;font:16px Arial;background:white;color:#292720}input[type=checkbox]{display:inline;width:auto;margin-right:8px}button,.button{display:inline-block;margin:14px 6px 0 0;padding:13px 18px;background:#292720;border:0;border-radius:4px;color:#fff;font:600 16px Arial;cursor:pointer;text-decoration:none}button.secondary{background:transparent;color:#292720;border:1px solid #aaa}button:disabled{opacity:.55}small{font-size:14px;color:#625e54}#status{white-space:pre-wrap}[hidden]{display:none!important}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}@media(max-width:550px){.grid{grid-template-columns:1fr}main{margin:10px auto;padding:15px}section{padding:20px}}</style></head><body><main><a href="./">MiseAI</a><h1 id="title">Checking your application</h1><section><p id="account"></p><p id="status" role="status" aria-live="polite">Loading your saved status…</p><p id="notice"></p><button id="refresh">Check status</button><a id="complete" class="button" href="template.html" hidden>Complete application</a><a id="dashboard" class="button" href="dashboard.html" hidden>Open dashboard</a><button id="switch" class="secondary">Use another Google account</button></section></main>
<script type="module">
import {currentUser,api,signOut} from './auth.js';
const status=document.getElementById('status'),refresh=document.getElementById('refresh'),title=document.getElementById('title');
document.getElementById('switch').onclick=()=>signOut().catch(e=>status.textContent=e.message);
async function check(){refresh.disabled=true;try{const user=await currentUser();if(!user){location.replace('template.html');return;}document.getElementById('account').textContent=user.email;const data=await api('onboarding-access');document.getElementById('complete').hidden=true;document.getElementById('dashboard').hidden=true;
if(data.status==='not_applied'){title.textContent='Complete your application';status.textContent='Your Google email is verified, but the full restaurant application has not been submitted.';document.getElementById('complete').hidden=false;}
else if(data.status==='approved'){title.textContent='Your restaurant is approved';status.textContent=data.restaurant_name+' is ready for onboarding.';sessionStorage.setItem('mise_dashboard_connection',JSON.stringify({restaurantId:data.restaurant_id,restaurantName:data.restaurant_name,apiToken:data.api_token,functionsBase:data.functions_base}));document.getElementById('dashboard').hidden=false;}
else if(data.status==='declined'){title.textContent='Application reviewed';status.textContent='Your application was not approved. Contact MiseAI if you have questions.';}
else {title.textContent='Application received';const draft=await api('onboarding-apply');const preference=draft.application?.contact_preference;status.textContent="We've received your information for "+data.restaurant_name+". "+(preference==='email'?"Michael will email you within one business day.":"Michael will call or email you within one business day.")+"\nYour restaurant is awaiting review. Service and billing have not started.";const notice=JSON.parse(sessionStorage.getItem('mise_application_notice')||'{}');document.getElementById('notice').textContent=['failed','uncertain'].includes(notice.notification)?'Your application is saved. The owner email notification needs attention; you do not need to submit again.':'';}
}catch(e){status.textContent='Could not check application status: '+e.message;}finally{refresh.disabled=false;}}
refresh.onclick=check;await check();
</script></body></html>
