<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MiseAI — Welcome</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet"><style id="mise-onboarding-theme">:root{color-scheme:dark;--bg:#0e1111;--surface:#232b2b;--gold:#a69467;--cream:#ffedc0;--text:#ffe297;--line:rgba(255,237,192,.18);font-family:Roboto,Arial,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 Roboto,Arial,sans-serif}header{border-bottom:1px solid var(--line);background:var(--surface)}nav{max-width:1100px;margin:auto;padding:22px 28px;display:flex;justify-content:space-between;gap:20px}.logo{font-size:24px;font-weight:800;color:var(--cream);text-decoration:none}main{max-width:1000px;margin:64px auto;padding:0 28px 70px}h1,h2,h3{color:var(--cream);line-height:1.16;letter-spacing:-.035em}h1{font-size:clamp(36px,6vw,62px);max-width:20ch;margin:12px 0 24px}h2{font-size:25px}p{max-width:65ch}a{color:var(--cream);text-underline-offset:4px}.eyebrow{color:var(--gold);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:12px}.intro{font-size:20px;max-width:58ch}.layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(240px,1fr);gap:28px;align-items:start}section,.panel{padding:28px;background:var(--surface);border:1px solid var(--line);border-radius:3px;margin-top:24px}aside{padding:12px 0}label{display:block;margin-top:20px;font-weight:600}input,select,textarea{width:100%;display:block;margin-top:7px;padding:12px;background:var(--bg);color:var(--cream);border:1px solid #777c70;border-radius:4px;font:inherit}input[type=checkbox]{display:inline;width:auto;margin-right:9px}button,.button{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:12px 20px;border:1px solid var(--gold);border-radius:3px;background:#998e70;color:var(--bg);font:700 16px/1.4 Roboto,Arial,sans-serif;cursor:pointer;text-decoration:none;margin:12px 10px 8px 0}button.secondary,.button.secondary{background:transparent;color:var(--cream)}button:disabled{opacity:.55;cursor:wait}:focus-visible{outline:3px solid var(--cream);outline-offset:4px}[hidden]{display:none!important}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 22px}small,.quiet{color:#d8c99f;font-size:14px}#status,#copyStatus{white-space:pre-wrap;overflow-wrap:anywhere}details{margin-top:25px;border-top:1px solid var(--line);padding-top:18px}summary{cursor:pointer;color:var(--cream);padding:8px 0}.steps{padding-left:24px}.steps li{padding:8px 0 16px 8px}.steps strong{display:block;color:var(--cream)}footer{border-top:1px solid var(--line);padding-top:25px;margin-top:40px}.worksheet{width:100%;border-collapse:collapse}.worksheet th,.worksheet td{border:1px solid var(--line);padding:12px;text-align:left}.worksheet td{height:58px}.table-wrap{overflow:auto}@media(max-width:700px){main{margin-top:35px;padding:0 20px 40px}.layout,.grid{grid-template-columns:1fr}section,.panel{padding:21px}nav{padding:18px 20px}}@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}body{background:var(--bg);color:var(--text)}header,button,.no-print,footer{display:none}main{margin:0;padding:0;max-width:none}section{background:var(--surface);border-color:var(--line);break-inside:avoid}input,textarea{background:var(--bg);color:var(--cream);border:1px solid var(--line)}.worksheet{font-size:11px}}
</style></head><body><main><a class="logo" href="./">MiseAI</a><h1>Welcome to MiseAI.</h1><p>Getting your workspace ready…</p><a href="template.html">Continue</a></main><script>location.replace('template.html'+location.search+location.hash);</script></body></html>
