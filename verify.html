<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MiseAI — Verify your email</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f1e8;color:#292720;font:16px/1.6 Arial,sans-serif}main{max-width:620px;margin:9vh auto;padding:30px}a{color:inherit}h1{font:500 36px/1.2 Georgia,serif}section{background:#fffdf8;border:1px solid #d7d0c2;padding:28px;border-radius:10px}button{font:600 16px Arial;padding:14px 20px;background:#292720;color:white;border:0;border-radius:5px;cursor:pointer;margin:10px 0}button:disabled{opacity:.6}#status{white-space:pre-wrap}small{display:block;color:#625e54;font-size:14px}#signout{background:transparent;color:#292720;border:1px solid #aaa} [hidden]{display:none!important}</style></head>
<body><main><a href="./">MiseAI</a><h1>Verify your email</h1><section><p>Use the Google account with the same email you entered on your restaurant request.</p><button id="google" type="button">Continue with Google</button><p id="status" role="status" aria-live="polite">Google sign-in confirms your identity. Restaurant access requires a separate MiseAI review and approval.</p><button id="signout" type="button" hidden>Use another Google account</button><small>MiseAI does not request access to your Gmail inbox, Google Drive, or payroll.</small></section></main>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/+esm';
const client=createClient('https://qhfmywontdwwfapowqpo.supabase.co',"sb_publishable_bZRuTAzX_5_SxZ9s0ofSIA_I12h1q3R",{auth:{flowType:'pkce',persistSession:true,storage:sessionStorage,autoRefreshToken:true,detectSessionInUrl:true}});
const button=document.getElementById('google'),status=document.getElementById('status'),signout=document.getElementById('signout');
const callback=new URL('verify.html',location.href).href;
button.addEventListener('click',async()=>{
 button.disabled=true;status.textContent='Opening Google sign-in…';
 try{const {error}=await client.auth.signInWithOAuth({provider:'google',options:{redirectTo:callback,queryParams:{prompt:'select_account'}}});if(error)throw error;}
 catch(e){status.textContent='Google sign-in could not start: '+e.message;button.disabled=false;}
});
signout.addEventListener('click',async()=>{await client.auth.signOut({scope:'local'});location.replace(callback);});
async function inspect(){
 try{
  const {data:{session},error}=await client.auth.getSession();if(error)throw error;
  if(!session)return;
  const {data:{user},error:verifyError}=await client.auth.getUser();if(verifyError)throw verifyError;
  if(!user?.email_confirmed_at||!user?.app_metadata?.providers?.includes('google'))throw Error('Sign in with a verified Google account.');
  button.hidden=true;signout.hidden=false;
  if(location.search||location.hash)history.replaceState(null,'',location.pathname);
  status.textContent='Google email verified: '+user.email+'\nChecking your application status…';
  const response=await fetch('https://qhfmywontdwwfapowqpo.supabase.co/functions/v1/onboarding-access',{headers:{Authorization:'Bearer '+session.access_token,apikey:"sb_publishable_bZRuTAzX_5_SxZ9s0ofSIA_I12h1q3R"}});
  const result=await response.json();
  if(!response.ok||!result.success)throw Error(result.error||'Could not check application status.');
  if(result.status==='approved')status.textContent='Google email verified: '+user.email+'\nRestaurant approved: '+result.restaurant_name+'.';
  else if(result.status==='not_applied')status.textContent='Google email verified: '+user.email+'\nA verified restaurant application has not been linked to this Google account yet. If you already requested access, do not submit a duplicate request. Continue with MiseAI to complete your application.';
  else status.textContent='Google email verified: '+user.email+'\nApplication status: '+result.status+'. Restaurant access is awaiting MiseAI review.';
 }catch(e){status.textContent='Verification needs attention: '+e.message;button.disabled=false;signout.hidden=false;}
}
const callbackError=new URLSearchParams(location.hash.slice(1)).get('error_description')||new URLSearchParams(location.search).get('error_description');
if(callbackError){history.replaceState(null,'',location.pathname);status.textContent='Google sign-in did not complete: '+callbackError;}else await inspect();
</script></body></html>
